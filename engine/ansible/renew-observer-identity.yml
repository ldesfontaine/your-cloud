---
- name: Activer une identité candidate du daemon avec rollback
  hosts: all
  gather_facts: false
  become: true
  vars:
    observer_user: your-cloud-observer
    observer_binary: /usr/libexec/your-cloud-observer
    observer_config: /etc/your-cloud/observer.json
  tasks:
    - name: Vérifier le binaire et la candidate préparée
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ observer_binary }}"
        - /var/lib/your-cloud/observer/identity.seed.pending
      register: renewal_inputs

    - name: Refuser une activation incomplète
      ansible.builtin.assert:
        that:
          - renewal_inputs.results | map(attribute='stat.exists') | min
        fail_msg: Binaire ou identité candidate absent

    - name: Activer la candidate sous protection du rollback
      block:
        - name: Arrêter uniquement le daemon d'observation
          ansible.builtin.systemd_service:
            name: your-cloud-observer.service
            state: stopped

        - name: Activer la candidate et préparer le rollback
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ observer_user }}"
              - --
              - "{{ observer_binary }}"
              - --config
              - "{{ observer_config }}"
              - commit-identity-renewal
          changed_when: true

        - name: Redémarrer uniquement le daemon d'observation
          ansible.builtin.systemd_service:
            name: your-cloud-observer.service
            state: started

      rescue:
        - name: Restaurer l'identité précédente
          ansible.builtin.command:
            argv:
              - /usr/sbin/runuser
              - -u
              - "{{ observer_user }}"
              - --
              - "{{ observer_binary }}"
              - --config
              - "{{ observer_config }}"
              - rollback-identity-renewal
          changed_when: true
          failed_when: false

        - name: Redémarrer le daemon après rollback
          ansible.builtin.systemd_service:
            name: your-cloud-observer.service
            state: started
          failed_when: false

        - name: Refuser le renouvellement après rollback
          ansible.builtin.fail:
            msg: Activation de l'identité refusée ; rollback tenté

---
- name: Enrôler le daemon d'observation
  hosts: all
  gather_facts: false
  become: true
  vars:
    observer_user: your-cloud-observer
    observer_state_dir: /var/lib/your-cloud/observer
  tasks:
    - name: Valider les paramètres bornés
      ansible.builtin.assert:
        that:
          - machine_id is match('^[a-z0-9][a-z0-9-]{0,62}$')
          - observer_binary is file
          - observer_units | length <= 32
        fail_msg: Paramètres d'enrôlement invalides

    - name: Créer le groupe sans privilège
      ansible.builtin.group:
        name: "{{ observer_user }}"
        system: true

    - name: Créer le compte non interactif
      ansible.builtin.user:
        name: "{{ observer_user }}"
        group: "{{ observer_user }}"
        system: true
        create_home: false
        home: "{{ observer_state_dir }}"
        shell: /usr/sbin/nologin
        password_lock: true

    - name: Garder le parent de stockage neutre
      ansible.builtin.file:
        path: /var/lib/your-cloud
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Créer le stockage privé du daemon
      ansible.builtin.file:
        path: "{{ observer_state_dir }}"
        state: directory
        owner: "{{ observer_user }}"
        group: "{{ observer_user }}"
        mode: "0700"

    - name: Créer le répertoire de configuration
      ansible.builtin.file:
        path: /etc/your-cloud
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Installer le daemon natif
      ansible.builtin.copy:
        src: "{{ observer_binary }}"
        dest: /usr/libexec/your-cloud-observer
        owner: root
        group: root
        mode: "0755"
      notify: Redémarrer le daemon

    - name: Installer la configuration bornée
      ansible.builtin.template:
        src: observer.json.j2
        dest: /etc/your-cloud/observer.json
        owner: root
        group: "{{ observer_user }}"
        mode: "0640"
      notify: Redémarrer le daemon

    - name: Installer l'unité systemd
      ansible.builtin.copy:
        src: your-cloud-observer.service
        dest: /etc/systemd/system/your-cloud-observer.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Recharger systemd
        - Redémarrer le daemon

    - name: Activer et démarrer le daemon
      ansible.builtin.systemd_service:
        name: your-cloud-observer.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Recharger systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Redémarrer le daemon
      ansible.builtin.systemd_service:
        name: your-cloud-observer.service
        state: restarted

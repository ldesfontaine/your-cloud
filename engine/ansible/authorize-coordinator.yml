---
- name: Autoriser un coordinateur distant sur une machine pilote
  hosts: all
  gather_facts: false
  become: true
  vars:
    observer_user: your-cloud-observer
  pre_tasks:
    - name: Valider les paramètres et artefacts locaux
      ansible.builtin.assert:
        that:
          - machine_id is match('^[a-z0-9][a-z0-9-]{0,62}$')
          - coordinator_url is match('^https://(\\[[0-9A-Fa-f:]+\\]|[A-Za-z0-9.-]+):[0-9]+$')
          - transport_ca is file
          - daemon_certificate is file
          - daemon_private_key is file
        fail_msg: Paramètres de migration du pilote invalides

    - name: Lire la configuration existante du daemon
      ansible.builtin.slurp:
        src: /etc/your-cloud/observer.json
      register: observer_configuration

    - name: Valider l'identité logique et préparer les points existants
      ansible.builtin.set_fact:
        observer_config: "{{ observer_configuration.content | b64decode | from_json }}"

    - name: Refuser un remplacement implicite ou une mauvaise machine
      ansible.builtin.assert:
        that:
          - observer_config.machine_id == machine_id
          - observer_config.coordinators | default([]) | length <= 2
          - >-
            (observer_config.coordinators | default([]) | selectattr('url', 'equalto', coordinator_url) | list | length > 0)
            or (observer_config.coordinators | default([]) | length < 2)
        fail_msg: Deux points différents sont déjà autorisés ; leur retrait exige un plan séparé

  tasks:
    - name: Créer le stockage TLS privé du daemon
      ansible.builtin.file:
        path: /etc/your-cloud/observer-tls
        state: directory
        owner: "{{ observer_user }}"
        group: "{{ observer_user }}"
        mode: "0700"

    - name: Installer l'identité mTLS propre à la machine
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ observer_user }}"
        group: "{{ observer_user }}"
        mode: "0400"
      loop:
        - {src: "{{ transport_ca }}", dest: /etc/your-cloud/observer-tls/ca.crt}
        - {src: "{{ daemon_certificate }}", dest: /etc/your-cloud/observer-tls/tls.crt}
        - {src: "{{ daemon_private_key }}", dest: /etc/your-cloud/observer-tls/tls.key}
      notify: Redémarrer le daemon

    - name: Essayer le nouveau point avant les secours existants
      ansible.builtin.copy:
        content: >-
          {{ observer_config | combine({
            'coordinators': ([{
                'url': coordinator_url,
                'ca_file': '/etc/your-cloud/observer-tls/ca.crt',
                'certificate_file': '/etc/your-cloud/observer-tls/tls.crt',
                'private_key_file': '/etc/your-cloud/observer-tls/tls.key'
              }] + (observer_config.coordinators | default([])
                | rejectattr('url', 'equalto', coordinator_url) | list))
          }) | to_nice_json }}
        dest: /etc/your-cloud/observer.json
        owner: root
        group: "{{ observer_user }}"
        mode: "0640"
      notify: Redémarrer le daemon

  handlers:
    - name: Redémarrer le daemon
      ansible.builtin.systemd_service:
        name: your-cloud-observer.service
        state: restarted

syntax = "proto3";

package yourcloud.telemetry.v1;

option go_package = "github.com/ldesfontaine/yourcloud/protocole/gen/go;telemetryv1";

enum TelemetryStream {
  TELEMETRY_STREAM_UNSPECIFIED = 0;
  TELEMETRY_STREAM_STATE = 1;
  TELEMETRY_STREAM_EVENT = 2;
}

message UnitState {
  string name = 1;
  string active_state = 2;
}

message MachineState {
  uint32 schema_version = 1;
  string machine_id = 2;
  string daemon_version = 3;
  uint64 sequence = 4;
  int64 observed_at_unix = 5;
  string debian_version = 6;
  string kernel_release = 7;
  string boot_id = 8;
  uint64 uptime_seconds = 9;
  double load_1 = 10;
  uint64 memory_total_bytes = 11;
  uint64 memory_available_bytes = 12;
  uint64 memory_used_bytes = 13;
  uint64 root_total_bytes = 14;
  uint64 root_free_bytes = 15;
  uint64 root_used_bytes = 16;
  bool security_reboot_required = 17;
  repeated UnitState units = 18;
  int64 booted_at_unix = 19;
}

message MachineEvent {
  uint32 schema_version = 1;
  string machine_id = 2;
  uint64 sequence = 3;
  int64 observed_at_unix = 4;
  string kind = 5;
  string detail = 6;
  uint64 gap_from_sequence = 7;
  uint64 gap_to_sequence = 8;
}

message SignedEnvelope {
  uint32 schema_version = 1;
  string key_id = 2;
  TelemetryStream stream = 3;
  bytes payload = 4;
  bytes signature = 5;
}

message PublishAck {
  uint32 schema_version = 1;
  string machine_id = 2;
  TelemetryStream stream = 3;
  uint64 sequence = 4;
  bool already_present = 5;
}

message EnvelopePage {
  uint32 schema_version = 1;
  repeated SignedEnvelope envelopes = 2;
  uint64 next_after_sequence = 3;
  bool has_more = 4;
}

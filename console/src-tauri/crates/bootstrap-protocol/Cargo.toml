[package]
name = "your-cloud-bootstrap-protocol"
version = "0.0.3"
description = "Contrats publics bornés entre la Console et l'Assistant d'amorçage Your Cloud"
authors = ["Lucas Desfontaine"]
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.183"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Performance"] }

[dev-dependencies]
serde_json = "=1.0.149"

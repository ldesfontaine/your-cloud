[package]
name = "your-cloud-bootstrap-protocol"
version = "0.1.4"
license = "AGPL-3.0-only"
description = "Contrats publics bornés entre la Console et l'Assistant d'amorçage Your Cloud"
authors = ["Lucas Desfontaine"]
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
# Décodage strict borné d'un document de plan : une seule valeur, aucune clé
# dupliquée, aucun champ inconnu, chaque champ sous son nom canonique exact. Le
# paquet était déjà dans le graphe de ce crate ; il passe de dépendance de test
# à dépendance simple parce que la Console vérifie de vrais documents reçus.
serde_json = "=1.0.149"
# Empreinte SHA-256 de la transcription d'un plan, à la version exacte que la
# Console utilise déjà. Ce n'est pas une primitive de signature : ce crate
# construit des octets et ne signe jamais.
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.183"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Performance"] }

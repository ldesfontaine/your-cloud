[package]
name = "your-cloud-native-bootstrap-assistant"
version = "0.0.3"
description = "Assistant natif ephemere d'amorcage Your Cloud"
authors = ["Lucas Desfontaine"]
edition = "2021"
rust-version = "1.88"
publish = false

[features]
windows-contract-test = []
native-prompt-contract-test = []
secret-crash-contract-test = []
windows-parent-spoof-contract-test = ["native-prompt-contract-test"]
windows-live-prompt-contract-test = ["native-prompt-contract-test"]
delayed-start-contract-test = ["native-prompt-contract-test"]
personal-access-contract-test = []
windows-agent-pipe-contract-test = []

[[bin]]
name = "your-cloud-native-bootstrap-assistant"
path = "src/main.rs"

[[bin]]
name = "your-cloud-secret-crash-fixture"
path = "src/secret_crash_fixture.rs"
required-features = ["secret-crash-contract-test"]

[[bin]]
name = "your-cloud-parent-spoof-fixture"
path = "src/parent_spoof_fixture.rs"
required-features = ["windows-parent-spoof-contract-test"]

[[bin]]
name = "your-cloud-delayed-start-fixture"
path = "src/delayed_start_fixture.rs"
required-features = ["delayed-start-contract-test"]

[[bin]]
name = "your-cloud-personal-access-fixture"
path = "src/personal_access_fixture.rs"
required-features = ["personal-access-contract-test"]

[[bin]]
name = "your-cloud-agent-pipe-fixture"
path = "src/agent_pipe_fixture.rs"
required-features = ["windows-agent-pipe-contract-test"]

[[test]]
name = "windows-job-contract"
path = "tests/windows_job_contract.rs"
harness = false
required-features = ["windows-contract-test"]

[[test]]
name = "process-contract"
path = "tests/process_contract.rs"
required-features = ["native-prompt-contract-test"]

[[test]]
name = "parent-contract"
path = "tests/parent_contract.rs"
required-features = ["native-prompt-contract-test"]

[[test]]
name = "secret-crash-contract"
path = "tests/secret_crash_contract.rs"
required-features = ["secret-crash-contract-test"]

[[test]]
name = "windows-parent-spoof-contract"
path = "tests/windows_parent_spoof_contract.rs"
required-features = ["windows-parent-spoof-contract-test"]

[[test]]
name = "windows-live-prompt-contract"
path = "tests/windows_live_prompt_contract.rs"
required-features = ["windows-live-prompt-contract-test"]

[[test]]
name = "delayed-start-contract"
path = "tests/delayed_start_contract.rs"
required-features = ["delayed-start-contract-test"]

[[test]]
name = "personal-access-contract"
path = "tests/personal_access_contract.rs"
required-features = ["personal-access-contract-test"]

[[test]]
name = "windows-agent-pipe-contract"
path = "tests/windows_agent_pipe_contract.rs"
required-features = ["windows-agent-pipe-contract-test"]

[dependencies]
# Client SSH du chemin d'accès personnel. Épinglé exactement, sans features
# par défaut : `Preferred::DEFAULT` reste inutilisable et chaque champ négocié
# est fermé explicitement par `personal_access::ssh_algorithms`.
russh = { version = "=0.62.4", default-features = false, features = ["ring", "rsa"] }
serde_json = "=1.0.149"
# Runtime du transport personnel. `russh` impose déjà exactement cette version ;
# la dépendance directe n'ajoute rien au graphe, elle rend seulement utilisable
# la boucle courante et le socket Unix que le client d'agent exige.
tokio = { version = "=1.53.0", default-features = false, features = [
  "io-util",
  "net",
  "rt",
  "time",
] }
your-cloud-bootstrap-protocol = { version = "=0.0.3", path = "../bootstrap-protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", default-features = false }
libc = "=0.2.183"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ErrorReporting",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

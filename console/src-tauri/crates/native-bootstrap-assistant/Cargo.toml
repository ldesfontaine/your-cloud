[package]
name = "your-cloud-native-bootstrap-assistant"
version = "0.0.3"
description = "Assistant natif ephemere d'amorcage Your Cloud"
authors = ["Lucas Desfontaine"]
edition = "2021"
rust-version = "1.88"
publish = false

[features]
windows-contract-test = []

[[bin]]
name = "your-cloud-native-bootstrap-assistant"
path = "src/main.rs"

[[test]]
name = "windows-job-contract"
path = "tests/windows_job_contract.rs"
harness = false
required-features = ["windows-contract-test"]

[dependencies]
serde_json = "=1.0.149"
your-cloud-bootstrap-protocol = { version = "=0.0.3", path = "../bootstrap-protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", default-features = false }
libc = "=0.2.183"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

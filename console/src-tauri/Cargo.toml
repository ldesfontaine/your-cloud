[package]
name = "your-cloud-console"
version = "0.0.3"
license = "AGPL-3.0-only"
description = "Console cliente native de Your Cloud"
authors = ["Lucas Desfontaine"]
edition = "2021"
rust-version = "1.88"

[features]
windows-contract-test = []

[workspace]
members = [
  "crates/bootstrap-protocol",
  "crates/native-bootstrap-assistant",
]
default-members = ["."]
resolver = "2"

[lib]
name = "your_cloud_console"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
base64 = "=0.22.1"
bip39 = { version = "=2.2.0", default-features = false, features = ["std", "french"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
hex = "=0.4.3"
hkdf = "=0.12.4"
iota_stronghold = "=2.1.0"
libc = "=0.2.183"
rand = "=0.8.5"
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
thiserror = "=2.0.18"
time = { version = "=0.3.47", features = ["parsing"] }
unicode-normalization = "=0.1.25"
unicode-general-category = "=1.1.0"
url = "=2.5.8"
uuid = "=1.24.0"
x509-parser = "=0.18.1"
your-cloud-bootstrap-protocol = { version = "=0.0.3", path = "crates/bootstrap-protocol" }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

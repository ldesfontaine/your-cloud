name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Contrôles génériques
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Extraire les sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Vérifier le contrat PowerShell Windows
        shell: pwsh
        run: ./tests/checks/console-windows-ci-contract.ps1

      # Le script n'importe que des modules Node natifs et un module local ; il
      # s'exécute donc avec le Node.js déjà présent sur le runner, sans
      # installation ni dépendance frontend. Le placer ici fait échouer une
      # violation en quelques secondes plutôt qu'après la matrice native.
      - name: Vérifier le contrat des sources Console
        run: node console/tests/check-source-contract.mjs

      - name: Installer Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Vérifier les sources v0.0.1
        run: ./tests/checks/source-v0.0.1 ci

      # La mesure qui justifie le conteneur du job `server_bundle` : l'outillage
      # du runner Ubuntu, confronté au verrou du lot. Elle observe et n'arbitre
      # pas — une divergence ici est attendue, c'est précisément pourquoi le lot
      # ne se construit jamais sur ce runner.
      - name: Mesurer l'outillage dpkg-deb/xz du runner face au verrou du lot
        run: |
          printf 'observé sur ubuntu-24.04 :\n'
          printf '  dpkg-deb %s\n' "$(dpkg-deb --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          printf '  xz       %s\n' "$(xz --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          printf 'verrou packaging/server-bundle/toolchain.lock :\n'
          grep -v '^#' packaging/server-bundle/toolchain.lock | sed 's/^/  /'

  server_bundle:
    name: Lot serveur reproductible
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Le lot se construit dans l'environnement exact que le verrou d'outillage
    # épingle : `debian:13` par digest — le tag seul est mobile, le digest ne
    # l'est pas. `dpkg-deb` 1.22.22 est dans l'image, `xz` 5.8.1 vient du dépôt
    # trixie, et `build-server-bundle` refuse toute dérive par son nom. Le
    # runner Ubuntu, lui, porte d'autres versions — la mesure du job `source`
    # le montre à chaque exécution.
    container:
      image: debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
    steps:
      - name: Extraire les sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # `ca-certificates` n'est pas pour apt (les miroirs Debian passent en
      # clair signé) : c'est `go` qui en a besoin pour joindre le proxy de
      # modules en TLS — sans lui, le premier `go build` échoue sur un
      # certificat inconnu, mesuré au premier passage de ce job.
      - name: Installer xz et les certificats depuis le dépôt trixie
        run: apt-get update && apt-get install --yes xz-utils ca-certificates

      - name: Installer Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      # Reconstruit le lot et le confronte octet pour octet au manifeste que le
      # mainteneur a signé. La porte vérifie, elle ne signe jamais : la moitié
      # privée de l'ancre n'existe dans aucun secret d'hébergement.
      - name: Construire le lot et le confronter au manifeste signé
        run: |
          version=$(sed -n 's/^  "version": "\([0-9a-zA-Z.+-]*\)",$/\1/p' console/package.json | head -1)
          test -n "$version"
          mkdir -p server-bundle-out
          ./tools/build-server-bundle "$version" . server-bundle-out
          cmp server-bundle-out/bundle-manifest.json packaging/server-bundle/manifest/bundle-manifest.json
          mv "server-bundle-out/your-cloud-server_${version}_amd64.deb" server-bundle-out/your-cloud-server.deb

      - name: Publier le lot pour le job Console
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-bundle
          path: server-bundle-out/your-cloud-server.deb
          if-no-files-found: error
          retention-days: 3

  console_platforms:
    name: Console ${{ matrix.label }}
    needs: [source, plumber_policy, server_bundle]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.94.1"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: Linux .deb
            runner: ubuntu-24.04
          - label: Windows .msi
            runner: windows-2025
    steps:
      - name: Extraire les sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Installer Rust
        run: >-
          rustup toolchain install 1.94.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Installer les dépendances natives Linux
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          xvfb
          dbus-x11
          lsof
          webkit2gtk-driver
          xdotool
          imagemagick
          gdb

      - name: Installer et vérifier le frontend
        working-directory: console
        run: npm ci

      - name: Auditer les dépendances frontend
        working-directory: console
        run: npm audit --audit-level=high

      - name: Tester et construire le frontend
        working-directory: console
        run: npm test && npm run build

      - name: Préparer et inspecter le helper natif
        working-directory: console
        run: |
          cargo +1.94.1 fetch --manifest-path src-tauri/Cargo.toml --locked
          npm run build:native-assistant

      - name: Vérifier le formatage Rust
        working-directory: console/src-tauri
        run: cargo +1.94.1 fmt --check

      - name: Prouver le crash et le dump synthétiques du secret natif
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features secret-crash-contract-test
          --test secret-crash-contract
          -- --test-threads=1

      - name: Tester le noyau natif
        working-directory: console/src-tauri
        run: cargo +1.94.1 test --release --locked --workspace

      # Ces contrats ne s'exécutent que là où leur périmètre existe (agent et
      # sshd réels sur une autre machine, tuyau d'agent Windows). La porte les
      # construit néanmoins : un code qu'aucune porte ne construit pourrit sans
      # que personne ne le sache.
      - name: Construire le contrat d'accès personnel sans l'exécuter
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked --no-run
          --package your-cloud-native-bootstrap-assistant
          --features personal-access-contract-test
          --test personal-access-contract

      - name: Construire les contrats de transport Windows sans les exécuter
        if: runner.os == 'Windows'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked --no-run
          --package your-cloud-native-bootstrap-assistant
          --features windows-agent-pipe-contract-test,windows-personal-transport-contract-test
          --test windows-agent-pipe-contract
          --test windows-personal-transport-contract

      - name: Tester le contrat processus du helper Linux
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features native-prompt-contract-test
          --test process-contract
          -- --test-threads=1

      - name: Refuser le renouvellement TTL avant process_main
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features delayed-start-contract-test
          --test delayed-start-contract
          delay_before_process_main_cannot_renew_the_transmitted_ttl
          -- --exact --test-threads=1

      - name: Tester le lancement du helper par le parent Linux
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features native-prompt-contract-test
          --test parent-contract
          console_parent_launches_the_exact_helper_and_refuses_to_invent_success
          -- --exact --test-threads=1

      - name: Tester l’annulation coopérative du parent Windows
        if: runner.os == 'Windows'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features native-prompt-contract-test
          --test parent-contract
          console_parent_closes_one_job_before_reusing_the_boundary
          -- --exact --test-threads=1

      - name: Refuser le parent Windows déclaré avec un transport attaquant
        if: runner.os == 'Windows'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features windows-parent-spoof-contract-test
          --test windows-parent-spoof-contract
          declared_parent_cannot_authorize_an_attacker_owned_pipe
          -- --exact --test-threads=1

      - name: Refuser les mutations d’un dialogue Win32 vivant
        if: runner.os == 'Windows'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features windows-live-prompt-contract-test
          --test windows-live-prompt-contract
          live_prompt_refuses_target_step_action_and_expiration_mutations
          -- --exact --test-threads=1

      - name: Prouver les handles et échecs suspendus Windows
        if: runner.os == 'Windows'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --locked
          --package your-cloud-native-bootstrap-assistant
          --features windows-contract-test
          --test windows-job-contract

      - name: Tester le consentement GTK3 isolé
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env NO_AT_BRIDGE=1
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          native_prompt::tests::gtk_dialog_handles_consent_secret_and_lease_states
          -- --ignored --exact --test-threads=1

      - name: Tester l’expiration coopérative GTK3 isolée
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env NO_AT_BRIDGE=1
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features native-prompt-contract-test
          --test process-contract
          watchdog_expires_a_live_prompt_before_the_forced_fallback
          -- --ignored --exact --test-threads=1

      - name: Prouver la fermeture des descripteurs hérités sous GTK3
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env NO_AT_BRIDGE=1
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features native-prompt-contract-test
          --test process-contract
          helper_closes_every_inherited_descriptor_outside_stdio
          -- --ignored --exact --test-threads=1

      - name: Refuser les mutations d’une fenêtre GTK3 vivante
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env NO_AT_BRIDGE=1
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features native-prompt-contract-test
          --test process-contract
          live_prompt_refuses_target_step_action_and_expiration_mutations
          -- --ignored --exact --test-threads=1

      - name: Tester le lancement GTK3 par le parent
        if: runner.os == 'Linux'
        working-directory: console/src-tauri
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env NO_AT_BRIDGE=1
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          --features native-prompt-contract-test
          --test parent-contract
          console_parent_keeps_the_gtk_helper_bounded_until_cancelled
          -- --ignored --exact --test-threads=1

      - name: Tester les dialogues Win32 isolés
        if: runner.os == 'Windows'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          native_prompt_windows::tests::win32_dialog_handles_consent_secret_tamper_and_lease_states
          -- --ignored --exact --test-threads=1

      - name: Tester la sélection d’identité Win32 isolée
        if: runner.os == 'Windows'
        working-directory: console/src-tauri
        run: >-
          cargo +1.94.1 test --release --locked
          --package your-cloud-native-bootstrap-assistant
          native_prompt_windows::tests::win32_identity_selection_binds_one_consent_to_one_chosen_fingerprint
          -- --ignored --exact --test-threads=1

      # Le lot serveur vient du job conteneurisé, jamais d'une construction sur
      # ce runner : l'outillage d'Ubuntu n'est pas celui du verrou, et la
      # préparation du build de la Console re-vérifie de toute façon l'artefact
      # déposé contre le manifeste signé avant de l'embarquer.
      - name: Recevoir le lot serveur du job conteneurisé
        if: runner.os == 'Linux'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-bundle
          path: console/src-tauri/server-bundle

      - name: Installer le pilote Tauri borné
        run: cargo +1.94.1 install tauri-driver --version 2.0.6 --locked

      - name: Construire, installer et lancer le .deb
        if: runner.os == 'Linux'
        run: >-
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env NO_AT_BRIDGE=1
          ./tests/checks/console-linux-ci

      - name: Construire, signer, installer et lancer le .msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/checks/console-windows-ci.ps1

      - name: Archiver le smoke WebView2 Windows
        # `always()` et non le succès : sur un rouge, cette capture est la seule
        # trace de ce que la fenêtre a montré, et c'est exactement là qu'elle
        # manquait. Une étape d'archivage sautée sur échec produit des rouges
        # qui n'accusent rien.
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-windows-webview2-smoke
          path: ${{ runner.temp }}/your-cloud-windows-webview2-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Archiver le smoke WebKitGTK Linux
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-linux-webkitgtk-smoke
          path: ${{ runner.temp }}/your-cloud-linux-webkitgtk-smoke
          if-no-files-found: warn
          retention-days: 7

  plumber_policy:
    name: Politique Plumber
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Extraire les sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Le garde indépendant s'exécute même si l'action échoue. Aucun
      # continue-on-error n'affaiblit pour autant ce job de sécurité.
      - name: Analyser la politique CI/CD
        id: plumber
        uses: getplumber/plumber@e81ed4965fd92e0d2b63e95d399ed0419f5de2fa # v0.4.36
        with:
          version: v0.4.8
          verify-attestation: "true"
          config-file: .plumber.yaml
          controls: "actionsMustBePinnedByCommitSha,githubActionMustComeFromAuthorizedSources,containerImageMustNotUseForbiddenTags,pipelineMustNotEnableDebugTrace,pipelineMustNotUseDockerInDocker,reusableWorkflowsMustNotInheritSecrets,workflowMustNotExportEntireSecretsContext,securityJobsMustNotBeWeakened,pipelineMustNotExecuteUnverifiedScripts,workflowMustNotInjectUserInputInScripts,workflowMustNotWriteUntrustedContentToGitHubEnv,workflowMustNotUseDangerousTriggers,pullRequestTargetMustNotCheckoutHead,workflowsMustDeclarePermissions,workflowMustNotGrantPermissionsWriteAll"
          min-points: "100"
          fail-warnings: "true"
          soft-fail: "false"
          upload-sarif: "false"
          upload-artifacts: "false"
          score-push: "false"
          output: plumber-report.json
          pbom: ""
          pbom-cyclonedx: ""
          sarif: ""

      - name: Rendre le résultat Plumber bloquant
        if: always()
        env:
          PLUMBER_ACTION_OUTCOME: ${{ steps.plumber.outcome }}
          PLUMBER_ACTION_PASSED: ${{ steps.plumber.outputs.passed }}
          PLUMBER_EXPECTED_SOURCE: ${{ github.sha }}
          PLUMBER_EXPECTED_PROJECT: ${{ github.repository }}
        run: >-
          python3 tests/checks/plumber-report.py
          --report plumber-report.json
          --action-outcome "$PLUMBER_ACTION_OUTCOME"
          --action-passed "$PLUMBER_ACTION_PASSED"
          --expected-source-identity "$PLUMBER_EXPECTED_SOURCE"
          --expected-project "$PLUMBER_EXPECTED_PROJECT"
          --expected-policy-hash
          "sha256:0f0bb61d3804cd311f580d05a209b8327b8b508623994d02f2d0073161edda3d"

      - name: Archiver le rapport Plumber validé
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plumber-report
          path: plumber-report.json
          if-no-files-found: error
          retention-days: 7
